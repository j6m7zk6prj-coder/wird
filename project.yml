# Décrit le projet Xcode. GitHub le transforme en projet Xcode avec XcodeGen avant de compiler.
name: Wird
options:
  bundleIdPrefix: com.wird
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "3.1"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_VERSION: "5.0"

targets:
  Wird:
    type: application
    platform: iOS
    sources:
      - path: Wird
      - path: Listen
      - path: Shared
    dependencies:
      - target: WirdWidget
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Wird
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # Écouter : la musique continue écran verrouillé, et le dossier Wird apparaît dans l'app Fichiers.
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSPhotoLibraryAddUsageDescription: "Wird enregistre les pochettes que tu choisis dans tes Photos."
        CFBundleURLTypes:
          - CFBundleURLName: com.wird.app
            CFBundleURLSchemes: [wird]
    entitlements:
      path: Support/Wird.entitlements
      properties:
        com.apple.security.application-groups: [group.com.wird.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wird.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Les widgets (écran d'accueil et écran verrouillé).
  WirdWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: WirdWidget
      - path: Shared
    info:
      path: Support/WirdWidget-Info.plist
      properties:
        CFBundleDisplayName: Wird
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Support/WirdWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.wird.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wird.app.widget
        SKIP_INSTALL: "YES"
